name: False positive
description: Report a VibeRaven finding that should not block launch.
title: "[False positive]: "
labels: ["false-positive", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping tune VibeRaven. Please avoid posting secrets, tokens, private keys, or real customer data.
  - type: input
    id: command
    attributes:
      label: Command
      description: Which VibeRaven command produced the finding?
      placeholder: npx -y viberaven --agent-mode .
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Finding that looks wrong
      description: Paste the relevant non-secret finding, tasklist item, or gate status.
      render: text
    validations:
      required: true
  - type: textarea
    id: repo_evidence
    attributes:
      label: Repo evidence VibeRaven should have accepted
      description: Point to files, config names, or redacted snippets that prove the finding is already handled.
      render: text
    validations:
      required: true
  - type: dropdown
    id: stack
    attributes:
      label: Stack area
      options:
        - Supabase / RLS
        - Vercel / deploy
        - Auth / redirects
        - Payments / webhooks
        - Monitoring / operations
        - Agent rules / MCP
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should VibeRaven report instead?
    validations:
      required: true
