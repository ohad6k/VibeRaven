name: Stack support request
description: Request checks for another framework, provider, or deployment path.
title: "[Stack request]: "
labels: ["stack-request", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        VibeRaven prioritizes checks that can be proven from local repo evidence without reading secrets.
  - type: input
    id: stack
    attributes:
      label: Stack or provider
      placeholder: "Example: Clerk + Vercel, Railway, Convex, Neon, Resend"
    validations:
      required: true
  - type: textarea
    id: launch_risks
    attributes:
      label: Launch risks to catch
      description: List the production failures or readiness gaps this stack commonly has.
    validations:
      required: true
  - type: textarea
    id: repo_evidence
    attributes:
      label: Local repo evidence
      description: Which files, scripts, env names, config files, or folder patterns indicate this stack and its readiness?
      render: text
    validations:
      required: true
  - type: textarea
    id: useful_output
    attributes:
      label: Useful VibeRaven output
      description: What should `.viberaven/agent-tasklist.md`, `.viberaven/prp.json`, or the local console tell the coding agent?
    validations:
      required: false
