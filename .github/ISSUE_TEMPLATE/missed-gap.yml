name: Missed production gap
description: Report a launch risk VibeRaven should have caught.
title: "[Missed gap]: "
labels: ["missed-gap", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when an AI-built app had a production-readiness gap that VibeRaven did not flag. Please keep secrets and customer data out of the issue.
  - type: input
    id: command
    attributes:
      label: Command
      description: Which VibeRaven command did you run?
      placeholder: npx -y viberaven --agent-mode .
    validations:
      required: true
  - type: dropdown
    id: gap_type
    attributes:
      label: Gap type
      options:
        - Supabase RLS or migrations
        - Vercel config or build
        - Environment variables
        - Auth callback or redirect
        - Webhook signature or route
        - Billing or product setup
        - Monitoring or observability
        - Tests or deploy workflow
        - Other
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What failed or nearly failed?
      description: Describe the production gap and how you noticed it.
    validations:
      required: true
  - type: textarea
    id: repo_signal
    attributes:
      label: Repo signal VibeRaven could inspect
      description: What local files, config, scripts, or redacted snippets should VibeRaven use to catch this?
      render: text
    validations:
      required: true
  - type: textarea
    id: expected_action
    attributes:
      label: Expected next action
      description: What tasklist item or gate result should VibeRaven produce?
    validations:
      required: false
