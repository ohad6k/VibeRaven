description = "Run launch readiness before calling an AI-built app ready for users"
prompt = "Run the VibeRaven launch-readiness pass. If the user wants the app online, use go-live to connect GitHub, push safely, deploy to Vercel, open official GitHub/Vercel pages when auth or dashboard setup is needed, and collect live URL proof. Collect fresh local verification evidence for the changed surfaces, inspect release/version risk, and list provider receipts needed for auth, database, billing, env, deployment, DNS, and monitoring. Classify the launch as ready, ready after named human/provider actions, or not ready because evidence is missing. Return exactly four sections: evidence found, evidence missing, repo-code fixes or none, provider or human action needed. Do not ask for secrets."
