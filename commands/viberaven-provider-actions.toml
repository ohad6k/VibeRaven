description = "Separate repo-code work from provider dashboard, MCP, or human actions"
prompt = "Use the provider-actions skill. Separate every item into repo-code fixes, MCP/provider-tool actions, provider dashboard actions, and evidence requests. For each provider action, name the provider, project/environment if known, dashboard path or setting, expected value or behavior, and acceptable evidence format. If a safe connected MCP/provider tool is available, use it for read-only context or explain the exact action it can perform. Do not ask for secrets. Return exactly four sections: evidence found, evidence missing, repo-code fixes or none, provider or human action needed."
