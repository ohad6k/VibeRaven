description = "Use Production Skills on the current auth, billing, database, env, monitoring, release, or provider task"
prompt = "Use the VibeRaven Production Skills as task workflows, not as a passive report. Inspect the repo and current task context, use Studio/MCP/provider context when available, then make safe repo-code changes if the user asked for implementation and approval mode allows it. Cover relevant surfaces: Supabase RLS, Stripe webhooks, Vercel env sync, Clerk callbacks, Sentry signal, release review, provider actions, launch readiness, and unsupported production claims. Return exactly four sections: evidence found, evidence missing, repo-code fixes or none, provider or human action needed. Do not claim provider dashboard checks are fixed by repo-code edits. Do not ask for passwords, tokens, cookies, signing secrets, or private keys."
