description = "Use VibeRaven on the current app task"
prompt = "Use VibeRaven as an architecture-first task workflow. Before editing, identify the product surface, architecture boundary, missing questions, release/version context, and provider risk. Read or propose .viberaven/production-context.md. Route to the suited skill: what-broke for regressions, production-context for durable architecture/provider memory, viberaven for Studio/MCP/context, and go-live for deploy proof. Then make the smallest repo-code fix the evidence supports if the user asked for implementation. Separate provider or human actions from repo-code fixes. Do not ask for secrets."
