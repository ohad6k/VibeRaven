    <rect x="388" y="250" width="630" height="74" rx="9" fill="#ffffff" stroke="#d9dee7"/>
    <text x="408" y="282" fill="#111417" font-size="15" font-weight="800">RLS policies</text>
    <text x="408" y="305" fill="#475467" font-size="13">User data must be protected by row ownership rules before launch.</text>
    <rect x="928" y="266" width="74" height="24" rx="12" fill="#fff2e5" stroke="#ff7a00"/><text x="946" y="283" fill="#ff7a00" font-size="11">Needs fix</text>
