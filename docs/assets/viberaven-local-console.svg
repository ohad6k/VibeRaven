  <text x="1104" y="336" fill="#344054" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">  auth, data, payment, tests.</text>
  <text x="1104" y="362" fill="#344054" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">- Keep findings local.</text>
  <text x="1104" y="388" fill="#344054" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="13">- Verify after the first fix.</text>
