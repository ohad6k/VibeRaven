    <text x="408" y="196" fill="#111417" font-size="15" font-weight="800">Schema and migrations</text>
    <text x="408" y="219" fill="#475467" font-size="13">Production data shape needs repo-owned evidence before real users write to it.</text>
    <rect x="928" y="180" width="74" height="24" rx="12" fill="#ffffff" stroke="#667085"/><text x="946" y="197" fill="#667085" font-size="11">Not checked</text>
