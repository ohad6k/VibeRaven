    <rect x="388" y="338" width="630" height="66" rx="9" fill="#ffffff" stroke="#d9dee7"/>
    <text x="408" y="368" fill="#111417" font-size="15" font-weight="800">Auth callbacks</text>
    <text x="408" y="391" fill="#475467" font-size="13">Authentication breaks when production callback URLs are missing or local-only.</text>
    <circle cx="366" cy="455" r="13" fill="#ffffff" stroke="#d0d5dd"/><circle cx="366" cy="455" r="4" fill="#667085"/>
    <rect x="388" y="422" width="630" height="66" rx="9" fill="#ffffff" stroke="#d9dee7"/>
    <text x="408" y="452" fill="#111417" font-size="15" font-weight="800">Production env</text>
    <text x="408" y="475" fill="#475467" font-size="13">Production database URLs and keys must be explicit and safely scoped.</text>
  </g>
